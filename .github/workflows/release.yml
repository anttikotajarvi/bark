name: Release pkl package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PKL_VERSION: 0.31.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pkl
        run: |
          curl -fsSL -o pkl "https://github.com/apple/pkl/releases/download/${PKL_VERSION}/pkl-linux-amd64"
          chmod +x pkl
          sudo mv pkl /usr/local/bin/pkl

      - name: Check tag matches package version
        run: |
          version=$(pkl eval -x package.version core/PklProject)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match PklProject version v$version" >&2
            exit 1
          fi

      - name: Package
        run: pkl project package core --output-path dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
